[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "visual-engine"
version = "1.3.8"
description = "Deterministic procedural visual entity engine - V1.3 spatial placement checkpoint"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "shapely>=2.1,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/visual_engine"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
